name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  attach:
    name: Create release and attach card
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the version in the card matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const CARD_VERSION = '${tag}'" dist/myastroboard-card.js \
            || { echo "CARD_VERSION in dist/myastroboard-card.js is not ${tag}"; exit 1; }
      - name: Build release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            $0 ~ "^## " ver " " {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "Release ${tag}"
              echo
              echo "See CHANGELOG.md for details."
            } > RELEASE_NOTES.md
          fi
      - name: Upload myastroboard-card.js
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/myastroboard-card.js
